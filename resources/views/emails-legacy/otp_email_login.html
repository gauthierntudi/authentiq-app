<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code de vérification</title>
</head>
<body style="margin:0; padding:0; font-family:'Segoe UI',Arial,sans-serif; background-color:#f4f4f4;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f4;">
        <tr>
            <td align="center" style="padding:20px 0;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px; background-color:#ffffff; border-radius:8px;">
                    <tr>
                        <td align="center" style="background-color:#38414a; padding:30px 20px; border-radius:8px 8px 0 0;">
                            <img src="https://res.cloudinary.com/dfqlmkknv/image/upload/v1779320289/logo-h_ipaqkt.png" height="50" alt="AuthentiQ" style="display:block; border:0;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:40px 30px; text-align:center;">
                            <h2 style="margin:0 0 20px 0; color:#38414a; font-size:22px;">
                                Code de vérification
                            </h2>
                            <p style="margin:0 0 30px 0; color:#555555; font-size:15px;">
                              <strong>{{USER_NAME}}</strong>, Voici votre code de vérification :
                            </p>
                            <div style="background-color:#f8f9fa; border-radius:8px; padding:20px; margin:0 0 30px 0;">
                                <span style="font-size:36px; font-weight:bold; color:#38414a; letter-spacing:8px;">{{OTP}}</span>
                            </div>
                            <p style="margin:0; color:#888888; font-size:13px;">
                                Ce code expire dans 10 minutes.
                                <br>
                                <br>
                                Garder jalousement ce code et ne donner à personne d'autre avant son expiration.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="background-color:#f8f9fa; padding:20px; border-radius:0 0 8px 8px;">
                            <!-- Icônes avec cercles -->
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 0 15px 0;">
                                <tr>
                                    <td align="center" style="padding:0 8px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" style="width:44px; height:44px; background-color:#e3e7f0; border-radius:50%; vertical-align:middle;">
                                                    <img src="https://res.cloudinary.com/dfqlmkknv/image/upload/v1779322022/lock_wnvbiu.png" width="24" height="24" alt="Sécurisé" style="display:block; margin:10px auto; border:0;">
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td align="center" style="padding:0 8px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" style="width:44px; height:44px; background-color:#dae5fc; border-radius:50%; vertical-align:middle;">
                                                    <img src="https://res.cloudinary.com/dfqlmkknv/image/upload/v1779322030/features-alt_kcwh8e.png" width="24" height="24" alt="Fonctionnalités" style="display:block; margin:10px auto; border:0;">
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td align="center" style="padding:0 8px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" style="width:44px; height:44px; background-color:#e8f5e9; border-radius:50%; vertical-align:middle;">
                                                    <img src="https://res.cloudinary.com/dfqlmkknv/image/upload/v1779322027/user-trust_dxtguq.png" width="24" height="24" alt="Confiance" style="display:block; margin:10px auto; border:0;">
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td align="center" style="padding:0 8px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                            <tr>
                                                <td align="center" style="width:44px; height:44px; background-color:#fce4ec; border-radius:50%; vertical-align:middle;">
                                                    <img src="https://res.cloudinary.com/dfqlmkknv/image/upload/v1779322024/badge_ihsxje.png" width="24" height="24" alt="Certifié" style="display:block; margin:10px auto; border:0;">
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                            <p style="margin:0; color:#888888; font-size:13px;">
                                &copy; {{ANNEE}} AuthentiQ. Tous droits réservés.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
